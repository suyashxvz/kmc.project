<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Layout · theme toggle</title>
    
    <!-- Import Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset + smooth theme transitions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        /* ===== DEFAULT THEME: DARK ===== */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;      /* dark background */
            color-scheme: dark;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10vh 8vw;
            overflow: hidden;
        }

        /* Left side "Hi," styling — muted dark gray */
        .logo-container {
            color: #2e2e2e;
            font-weight: 600;
            line-height: 0.75;
            font-size: 25vw;
            letter-spacing: -0.05em;
            user-select: none;
        }

        /* Right side navigation styling */
        .nav-menu {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            font-size: 1.8rem;
            color: #4a4a4a;
            font-weight: 300;
            text-align: right;
            margin-bottom: 2vh;
        }

        .nav-item {
            transition: color 0.3s ease;
            cursor: pointer;
        }

        .nav-item:hover {
            color: #9f9f9f;
        }

        /* ===== THEME SWITCHER (under "Visit My Profolio") ===== */
        .theme-switcher {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.4rem;
            margin-top: 1.4rem;
            padding-top: 0.9rem;
            border-top: 1px solid #2a2a2a;
            width: 100%;
            user-select: none;
        }

        /* main theme button (dark mode indicator) */
        .theme-option {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.6rem;
            font-size: 0.95rem;
            font-weight: 400;
            color: #7a7a7a;
            cursor: pointer;
            transition: color 0.2s ease;
            line-height: 1.3;
            width: 100%;
            padding: 0.1rem 0;
        }

        .theme-option:hover {
            color: #c0c0c0;
        }

        /* active state for the selected theme */
        .theme-option.active {
            color: #d0d0d0;
            font-weight: 400;
        }

        .theme-option .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.3rem;
            height: 1.3rem;
            flex-shrink: 0;
        }

        .theme-option .icon svg {
            width: 1.2rem;
            height: 1.2rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .theme-option .label {
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }

        /* "Light" sub-option — slightly smaller, indented feel */
        .theme-option.sub {
            font-size: 0.9rem;
            color: #5a5a5a;
            padding-left: 1.9rem;    /* indent to create a sub-level look */
            gap: 0.5rem;
            justify-content: flex-start;  /* left-align the sub option */
        }

        .theme-option.sub .icon {
            width: 1.1rem;
            height: 1.1rem;
        }

        .theme-option.sub .icon svg {
            width: 1rem;
            height: 1rem;
        }

        .theme-option.sub .label {
            font-size: 0.85rem;
        }

        .theme-option.sub:hover {
            color: #a0a0a0;
        }

        .theme-option.sub.active {
            color: #b0b0b0;
        }

        /* ===== LIGHT THEME OVERRIDES (body.light) ===== */
        body.light {
            background-color: #ffffff;
            color-scheme: light;
        }

        body.light .logo-container {
            color: #c8c8c8;
        }

        body.light .nav-menu {
            color: #dcdcdc;
        }

        body.light .nav-item {
            color: #dcdcdc;
        }

        body.light .nav-item:hover {
            color: #999;
        }

        body.light .theme-switcher {
            border-top-color: #eaeaea;
        }

        body.light .theme-option {
            color: #b0b0b0;
        }

        body.light .theme-option:hover {
            color: #777;
        }

        body.light .theme-option.active {
            color: #666;
        }

        body.light .theme-option.sub {
            color: #c0c0c0;
        }

        body.light .theme-option.sub:hover {
            color: #888;
        }

        body.light .theme-option.sub.active {
            color: #777;
        }

        /* Responsive adjustments for mobile */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-end;
                padding: 5vh 5vw;
            }

            .logo-container {
                font-size: 40vw;
                margin-bottom: 5vh;
            }

            .nav-menu {
                align-items: flex-start;
                text-align: left;
                font-size: 1.2rem;
                width: 100%;
            }

            .theme-switcher {
                align-items: flex-start;
                margin-top: 1.5rem;
                padding-top: 0.9rem;
                width: 100%;
            }

            .theme-option {
                justify-content: flex-start;
            }

            .theme-option.sub {
                padding-left: 1.6rem;
            }
        }
    </style>
</head>
<body class="dark">   <!-- default is dark -->

    <!-- Left side large text -->
    <div class="logo-container">
        Hi,
    </div>

    <!-- Right side: navigation + theme switcher -->
    <div class="nav-menu">
        <div class="nav-item">Explore</div>
        <div class="nav-item">BRU Sunglasses</div>
        <div class="nav-item">MKK. Watches</div>
        <div class="nav-item">LTP Charger</div>
        <div class="nav-item">Visit My Profolio</div>

        <!-- THEME SWITCHER: dark is main, light is sub -->
        <div class="theme-switcher" id="themeSwitcher">
            
            <!-- DARK (default active) -->
            <div class="theme-option active" data-theme="dark" id="darkOption" role="button" tabindex="0" aria-label="Dark theme">
                <span class="icon">
                    <!-- moon icon (consistent stroke style) -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </span>
                <span class="label">Dark</span>
            </div>

            <!-- LIGHT (sub option) -->
            <div class="theme-option sub" data-theme="light" id="lightOption" role="button" tabindex="0" aria-label="Light theme">
                <span class="icon">
                    <!-- sun icon (same stroke style) -->
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </span>
                <span class="label">Light</span>
            </div>

        </div>
    </div>

    <script>
        (function() {
            const body = document.body;
            const darkOption = document.getElementById('darkOption');
            const lightOption = document.getElementById('lightOption');

            // ----- apply theme class & update active state -----
            function setTheme(theme) {
                // remove both theme classes, then add the correct one
                body.classList.remove('dark', 'light');
                body.classList.add(theme);
                
                // update active class on switcher options
                if (theme === 'dark') {
                    darkOption.classList.add('active');
                    lightOption.classList.remove('active');
                } else {
                    lightOption.classList.add('active');
                    darkOption.classList.remove('active');
                }
                
                // store preference
                localStorage.setItem('theme', theme);
            }

            // ----- initial load: default dark, unless saved preference -----
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                setTheme(savedTheme);
            } else {
                // no saved preference → default to dark
                setTheme('dark');
            }

            // ----- event listeners (click + keyboard) -----
            function handleThemeClick(theme) {
                setTheme(theme);
            }

            // dark option listeners
            darkOption.addEventListener('click', () => handleThemeClick('dark'));
            darkOption.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleThemeClick('dark');
                }
            });

            // light option listeners
            lightOption.addEventListener('click', () => handleThemeClick('light'));
            lightOption.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleThemeClick('light');
                }
            });

            // optional: listen to system preference changes only if no saved theme
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (localStorage.getItem('theme') === null) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
        })();
    </script>
</body>
</html>
