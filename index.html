<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi Layout · theme toggle</title>

    <!-- Import Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset + smooth theme transitions */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
        }

        /* ===== DEFAULT THEME: DARK ===== */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color-scheme: dark;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 10vh 8vw;
            overflow: hidden;
        }

        /* Left side "Hi," styling */
        .logo-container {
            color: #2e2e2e;
            font-weight: 600;
            line-height: 0.75;
            font-size: 25vw;
            letter-spacing: -0.05em;
            user-select: none;
            flex-shrink: 0;
        }

        /* Right side navigation */
        .nav-menu {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.5rem;
            font-size: 1.8rem;
            color: #4a4a4a;
            font-weight: 300;
            text-align: right;
            margin-bottom: 2vh;
            max-width: 45vw;
        }

        /* Nav items are now anchors — reset link styles */
        .nav-item {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
            display: inline-block;
        }

        .nav-item:hover {
            color: #9f9f9f;
        }

        /* ===== SINGLE THEME TOGGLE BUTTON ===== */
        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.55rem;
            margin-top: 1.4rem;
            padding-top: 0.9rem;
            border-top: 1px solid #2a2a2a;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 400;
            color: #7a7a7a;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }

        .theme-toggle:hover {
            color: #c0c0c0;
        }

        .theme-toggle .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.2rem;
            height: 1.2rem;
            flex-shrink: 0;
        }

        .theme-toggle .icon svg {
            width: 1.1rem;
            height: 1.1rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle .label {
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }

        /* ===== LIGHT THEME OVERRIDES ===== */
        body.light {
            background-color: #ffffff;
            color-scheme: light;
        }

        body.light .logo-container {
            color: #c8c8c8;
        }

        body.light .nav-menu {
            color: #dcdcdc;
        }

        body.light .nav-item {
            color: #dcdcdc;
        }

        body.light .nav-item:hover {
            color: #999;
        }

        body.light .theme-toggle {
            border-top-color: #eaeaea;
            color: #b0b0b0;
        }

        body.light .theme-toggle:hover {
            color: #777;
        }

        /* ===== RESPONSIVE: MOBILE ===== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                align-items: flex-start;
                justify-content: flex-end;
                padding: 5vh 6vw;
                overflow-y: auto;
                overflow-x: hidden;
                min-height: 100vh;
                height: auto;
            }

            .logo-container {
                font-size: 30vw;
                margin-bottom: 3vh;
                line-height: 0.7;
            }

            .nav-menu {
                align-items: flex-end;
                text-align: right;
                font-size: 1.4rem;
                width: 100%;
                max-width: 100%;
                margin-bottom: 0;
                gap: 0.4rem;
            }

            .nav-item {
                white-space: normal;
                word-break: break-word;
            }

            .theme-toggle {
                justify-content: flex-end;
                margin-top: 1.2rem;
                padding-top: 0.8rem;
                width: 100%;
            }
        }

        /* Very small screens */
        @media (max-width: 400px) {
            .nav-menu {
                font-size: 1.2rem;
            }
            .logo-container {
                font-size: 35vw;
            }
        }
    </style>
</head>
<body class="dark">

    <!-- Left side large text -->
    <div class="logo-container">
        Hi,
    </div>

    <!-- Right side: navigation + single theme toggle -->
    <div class="nav-menu">
        <a href="https://github.com/suyashxvz" target="_blank" rel="noopener noreferrer" class="nav-item">Explore</a>
        <a href="https://suyashxvz.github.io/bru.glasses/" target="_blank" rel="noopener noreferrer" class="nav-item">BRU Sunglasses</a>
        <a href="https://suyashxvz.github.io/mkk.watches" target="_blank" rel="noopener noreferrer" class="nav-item">MKK. Watches</a>
        <div class="nav-item">LTP Charger</div>
        <a href="https://suyashxvz.github.io/portfolio/" target="_blank" rel="noopener noreferrer" class="nav-item">Visit My Portfolio</a>

        <!-- SINGLE THEME TOGGLE BUTTON -->
        <div class="theme-toggle" id="themeToggle" role="button" tabindex="0" aria-label="Toggle theme">
            <span class="icon" id="themeIcon">
                <!-- Default: moon icon (dark theme active) -->
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </span>
            <span class="label" id="themeLabel">Dark</span>
        </div>
    </div>

    <script>
        (function() {
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const label = document.getElementById('themeLabel');

            // SVG markup for both icons
            const moonSVG = `
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>`;

            const sunSVG = `
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>`;

            // Apply theme and update the button in place
            function setTheme(theme) {
                body.classList.remove('dark', 'light');
                body.classList.add(theme);

                if (theme === 'dark') {
                    icon.innerHTML = moonSVG;
                    label.textContent = 'Dark';
                } else {
                    icon.innerHTML = sunSVG;
                    label.textContent = 'Light';
                }

                localStorage.setItem('theme', theme);
            }

            // Initial load — default dark, unless saved preference
            const savedTheme = localStorage.getItem('theme');
            setTheme(savedTheme === 'light' ? 'light' : 'dark');

            // Toggle handler
            function toggleTheme() {
                const isDark = body.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            }

            toggle.addEventListener('click', toggleTheme);
            toggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleTheme();
                }
            });

            // Respond to system theme changes only if no saved preference
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (localStorage.getItem('theme') === null) {
                    setTheme(e.matches ? 'dark' : 'light');
                }
            });
        })();
    </script>
</body>
</html>
